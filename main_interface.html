  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b5103367-d5ea-42b5-9f89-fe3b9e493be4\"><\u002Fscript>\n<\u002Fhead>\n\n<body>\n<x-dc>\n<helmet>\n  <style>\n    html, body { margin: 0; padding: 0; min-height: 100%; background: #e9e9ec; }\n    button:focus-visible, [role=\"button\"]:focus-visible { outline: 3px solid #f5842e; outline-offset: 2px; }\n    input[type=\"search\"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }\n    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }\n    @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }\n    @media (max-width: 980px) {\n      #topbar { grid-template-columns: 1fr auto !important; grid-template-rows: auto auto; row-gap: 16px; }\n      #segmented { grid-column: 1 / -1; grid-row: 2; justify-self: center; }\n      #catalog-title { font-size: 32px !important; }\n    }\n    @media (max-width: 620px) {\n      #userbox { display: none !important; }\n      #segmented { width: 100% !important; }\n      #catalog-title { font-size: 26px !important; }\n      [role=\"button\"] { flex-wrap: wrap; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; width: 100%; background: linear-gradient(145deg, #f4f4f7, #ebebee); color: #1c1c1e; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 56px) 56px; display: flex; flex-direction: column; gap: 28px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased;\">\n\n    <div id=\"topbar\" style=\"display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 22px; border-bottom: 1px solid rgba(174,174,192,0.35);\">\n      <div style=\"justify-self: start; display: flex; align-items: center; gap: 14px; text-align: left;\">\n        <div style=\"width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); box-shadow: 8px 8px 20px rgba(174,174,192,0.35), -8px -8px 20px rgba(255,255,255,0.9); display: grid; place-items: center; flex-shrink: 0;\">\n          <span style=\"font-size: 20px; font-weight: 800; background: linear-gradient(120deg, #f5842e, #ffb35c); -webkit-background-clip: text; background-clip: text; color: transparent;\">С<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: #1c1c1e;\">ООО «СтройМатериалы»<\u002Fspan>\n      <\u002Fdiv>\n\n      <div id=\"segmented\" role=\"tablist\" style=\"position: relative; display: flex; background: #ececef; border-radius: 999px; box-shadow: inset 3px 3px 8px rgba(174,174,192,0.3), inset -3px -3px 8px rgba(255,255,255,0.7); padding: 5px; width: 309px; height: 42px; box-sizing: border-box;\">\n        <div style=\"position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px); border-radius: 999px; background: linear-gradient(180deg, #ffffff, #f2f2f5); box-shadow: 0 3px 8px rgba(174,174,192,0.4), 0 1px 2px rgba(174,174,192,0.3); transform: {{ pillTransform }}; transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);\"><\u002Fdiv>\n        <button role=\"tab\" aria-selected=\"{{ productsSelected }}\" onclick=\"{{ tabProducts }}\" style=\"position: relative; z-index: 1; flex: 1; border: none; background: transparent; font-size: 17px; color: {{ tabProductsColor }}; font-weight: {{ tabProductsWeight }}; padding: 0; border-radius: 999px; cursor: pointer; transition: color 0.25s ease; font-family: inherit;\">Товары<\u002Fbutton>\n        <button role=\"tab\" aria-selected=\"{{ ordersSelected }}\" onclick=\"{{ tabOrders }}\" style=\"position: relative; z-index: 1; flex: 1; border: none; background: transparent; font-size: 17px; color: {{ tabOrdersColor }}; font-weight: {{ tabOrdersWeight }}; padding: 0; border-radius: 999px; cursor: pointer; transition: color 0.25s ease; font-family: inherit;\">Заказы<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div id=\"userbox\" style=\"justify-self: end; display: flex; align-items: center; gap: 16px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); border-radius: 999px; padding: 8px 20px 8px 8px; box-shadow: 8px 8px 20px rgba(174,174,192,0.35), -8px -8px 20px rgba(255,255,255,0.9);\">\n          <div style=\"width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(90deg, #ffd9a8, #f5842e); display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #fff;\">А<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; text-align: left;\">\n            <span style=\"font-size: 15px; font-weight: 600; color: #1c1c1e;\">Администратор системы<\u002Fspan>\n            <span style=\"font-size: 13px; color: #8a8a8e;\">Администратор<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button aria-label=\"Выйти\" title=\"Выйти\" style=\"width: 53px; height: 53px; border: none; border-radius: 18px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); box-shadow: 8px 8px 20px rgba(174,174,192,0.35), -8px -8px 20px rgba(255,255,255,0.9); cursor: pointer; display: grid; place-items: center; transition: transform 0.15s ease;\" style-active=\"transform: scale(0.94);\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1e\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M14 4 H7 a2 2 0 0 0 -2 2 v12 a2 2 0 0 0 2 2 h7\"><\u002Fpath>\n            <path d=\"M11 12 h9\"><\u002Fpath>\n            <path d=\"M17 8.5 L20.5 12 L17 15.5\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showProducts }}\" hint-placeholder-val=\"{{ true }}\">\n    <h1 id=\"ca splay: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 24px; color: #8a8a8e;\">\n        <span style=\"font-size: 18px; font-weight: 600; color: #3a3a3c;\">Ничего не найдено<\u002Fspan>\n        <span style=\"font-size: 14px;\">Измените запрос или сбросьте фильтры<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n      <sc-for list=\"{{ cards }}\" as=\"card\" hint-placeholder-count=\"9\">\n        <div role=\"button\" tabindex=\"0\" onclick=\"{{ card.select }}\" onkeydown=\"{{ card.keySelect }}\" style=\"display: flex; align-items: stretch; gap: 24px; width: 100%; background: linear-gradient(145deg, #f6f6f9, #eeeef1); border-radius: 24px; border: {{ card.border }}; padding: 18px; cursor: pointer; box-shadow: {{ card.shadow }}; transition: transform 0.2s ease, box-shadow 0.2s ease; box-sizing: border-box;\" style-hover=\"transform: translateY(-3px); box-shadow: 12px 14px 28px rgba(174,174,192,0.45), -8px -8px 20px rgba(255,255,255,0.9);\">\n          <div style=\"width: 200px; min-height: 140px; flex-shrink: 0; border-radius: 16px; background-color: #e3e3e6; background-image: {{ card.photoBg }}; background-size: cover; background-position: center; box-shadow: inset 2px 2px 6px rgba(174,174,192,0.25), inset -2px -2px 6px rgba(255,255,255,0.6); display: grid; place-items: center;\">\n            <span style=\"font-size: 14px; color: #8a8a8e;\">{{ card.photoLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"display: flex; align-items: center; gap: 12px;\">\n              <h2 style=\"font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin: 0;\">{{ card.name }}<\u002Fh2>\n              <span style=\"font-size: 12px; font-weight: 600; color: #8a8a8e; background: #ececef; border-radius: 999px; padding: 4px 12px; box-shadow: inset 1px 1px 3px rgba(174,174,192,0.3), inset -1px -1px 3px rgba(255,255,255,0.7); white-space: nowrap;\">{{ card.cat }}<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size: 13px; color: #8a8a8e;\">Артикул {{ card.art }} · {{ card.maker }}<\u002Fspan>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: #3a3a3c; max-width: 720px;\">{{ card.desc }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; flex-shrink: 0; padding-left: 24px; border-left: 1px solid rgba(174,174,192,0.3);\">\n            <b style=\"font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;\">{{ card.price }}<\u002Fb>\n            <span style=\"font-size: 13px; color: #8a8a8e; font-variant-numeric: tabular-nums; white-space: nowrap;\">Остаток: {{ card.stock }} шт.<\u002Fspan>\n            <span style=\"font-size: 13px; color: #8a8a8e; font-variant-numeric: tabular-nums; white-space: nowrap;\">Скидка: {{ card.disc }} %<\u002Fspan>\n            <div style=\"display: flex; gap: 10px; margin-top: 8px;\">\n              <button aria-label=\"Редактировать\" title=\"Редактировать\" onclick=\"{{ card.edit }}\" style=\"width: 38px; height: 38px; border: none; border-radius: 12px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); box-shadow: 4px 4px 10px rgba(174,174,192,0.35), -4px -4px 10px rgba(255,255,255,0.9); cursor: pointer; display: grid; place-items: center; transition: transform 0.15s ease;\" style-active=\"transform: scale(0.92);\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1e\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M4 20 h16\"><\u002Fpath>\n                  <path d=\"M14.5 4.5 a2.1 2.1 0 0 1 3 3 L8 17 l-4 1 1-4 z\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fbutton>\n              <button aria-label=\"Удалить\" title=\"Удалить\" onclick=\"{{ card.remove }}\" style=\"width: 38px; height: 38px; border: none; border-radius: 12px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); box-shadow: 4px 4px 10px rgba(174,174,192,0.35), -4px -4px 10px rgba(255,255,255,0.9); cursor: pointer; display: grid; place-items: center; transition: transform 0.15s ease;\" style-active=\"transform: scale(0.92);\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#d0453c\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n                  <path d=\"M4 7 h16\"><\u002Fpath>\n                  <path d=\"M9 7 V5 a1 1 0 0 1 1 -1 h4 a1 1 0 0 1 1 1 v2\"><\u002Fpath>\n                  <path d=\"M6.5 7 l1 13 a1 1 0 0 0 1 1 h7 a1 1 0 0 0 1 -1 l1 -13\"><\u002Fpath>\n                  <path d=\"M10 11 v6 M14 11 v6\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showOrders }}\" hint-placeholder-val=\"{{ false }}\">\n    <h1 style=\"font-size: 38px; font-weight: 700; letter-spacing: -0.5px; margin: 0; text-align: center;\">Заказы<\u002Fh1>\n\n    <div style=\"position: relative; width: min(640px, 100%); margin: 0 auto;\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8a8a8e\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position: absolute; left: 18px; top: 50%; transform: translateY(-50%); pointer-events: none;\">\n        <circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle>\n        <path d=\"M20 20 l-3.5 -3.5\"><\u002Fpath>\n      <\u002Fsvg>\n      <input type=\"search\" placeholder=\"Поиск по заказам…\" value=\"{{ orderQuery }}\" onchange=\"{{ onOrderQuery }}\" style=\"width: 100%; height: 48px; border: none; border-radius: 999px; background: #ececef; box-shadow: inset 3px 3px 8px rgba(174,174,192,0.3), inset -3px -3px 8px rgba(255,255,255,0.7); padding: 0 44px 0 48px; font-size: 15px; color: #1c1c1e; font-family: inherit; box-sizing: border-box; outline: none;\">\n      <sc-if value=\"{{ orderClearVisible }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ clearOrderQuery }}\" aria-label=\"Очистить поиск\" style=\"position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0;\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1e\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\n            <path d=\"M6 6 L18 18 M18 6 L6 18\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"width: 100%; overflow-x: auto;\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px; max-width: 1360px; min-width: 980px; margin: 0 auto;\">\n        <div style=\"display: grid; grid-template-columns: 0.6fr 1.8fr 1fr 1fr 1fr 1.9fr 1.1fr 1fr 52px; gap: 10px; background: #e7e7ea; border-radius: 16px; padding: 16px 20px; font-weight: 600; text-align: center; align-items: center;\">\n          <div>Номер заказа<\u002Fdiv><div>Артикул заказа<\u002Fdiv><div>Дата заказа<\u002Fdiv><div>Дата доставки<\u002Fdiv><div>Адрес пункта выдачи<\u002Fdiv><div>ФИО авторизированного клиента<\u002Fdiv><div>Код для получения<\u002Fdiv><div>Статус заказа<\u002Fdiv><div><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ orders }}\" as=\"o\" hint-placeholder-count=\"10\">\n          <div style=\"display: grid; grid-template-columns: 0.6fr 1.8fr 1fr 1fr 1fr 1.9fr 1.1fr 1fr 52px; gap: 10px; background: #f0f0f3; border-radius: 16px; padding: 15px 20px; text-align: center; align-items: center;\" style-hover=\"background: aceholder-val=\"{{ false }}\">\n                <button onclick=\"{{ clearPhoto }}\" style=\"height: 42px; border: none; border-radius: 999px; background: transparent; padding: 0 14px; font-size: 14px; font-weight: 600; color: #d0453c; cursor: pointer; font-family: inherit;\">Убрать фото<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 0; font-size: 14px; color: #d0453c;\">{{ formError }}<\u002Fp>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px;\">\n            <button onclick=\"{{ closeModal }}\" style=\"height: 46px; border: none; border-radius: 999px; background: linear-gradient(145deg, #f6f6f9, #e9e9ec); box-shadow: 4px 4px 12px rgba(174,174,192,0.35), -4px -4px 12px rgba(255,255,255,0.9); padding: 0 26px; font-size: 15px; font-weight: 600; color: #3a3a3c; cursor: pointer; font-family: inherit; transition: transform 0.15s ease;\" style-active=\"transform: scale(0.96);\">Отмена<\u002Fbutton>\n            <button onclick=\"{{ saveForm }}\" style=\"height: 46px; border: none; border-radius: 999px; background: linear-gradient(180deg, #f79a4a, #f5842e); color: #fff; padding: 0 30px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; box-shadow: 0 8px 20px rgba(245,132,46,0.35), inset 0 1px 0 rgba(255,255,255,0.35); transition: transform 0.15s ease;\" style-active=\"transform: scale(0.96);\">Сохранить<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentStart&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffd9a8&quot;,&quot;options&quot;:[&quot;#ffd9a8&quot;,&quot;#bcd4ff&quot;,&quot;#c4ecd4&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:  price: 13203, disc: 1,   stock: 51,  cat: \"Декор\",  maker: \"Уют Декор\",     desc: \"Ковёр из натуральной шерсти ручного плетения. Гипоаллергенный, размер 160×230 см.\" },\n    { art: \"AR-1049\", name: \"Зеркало напольное\",  price: 13104, disc: 1.1, stock: 30,  cat: \"Декор\",  maker: \"Уют Декор\",     desc: \"Напольное зеркало в тонкой металлической раме. Наклон регулируется, высота 165 см.\" },\n    { art: \"AR-1050\", name: \"Стеллаж модульный\",  price: 11904, disc: 1.1, stock: 16,  cat: \"Мебель\", maker: \"ДомСтрой\",      desc: \"Модульный стеллаж из шести секций. Можно комбинировать вертикально и горизонтально.\" },\n  ];\n\n  componentDidMount() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(\"tovary-controls\") || \"{}\");\n      const next = {};\n      if (typeof saved.query === \"string\") next.query = saved.query;\n      if (typeof saved.maker === \"string\") next.maker = saved.maker;\n      if (typeof saved.sort === \"string\") next.sort = saved.sort;\n      const items = JSON.parse(localStorage.getItem(\"tovary-items\") || \"null\");\n      if (Array.isArray(items) && items.length) next.items = items;\n      const orderItems = JSON.parse(localStorage.getItem(\"tovary-orders\") || \"null\");\n      if (Array.isArray(orderItems)) next.orderItems = orderItems;\n      if (Object.keys(next).length) this.setState(next);\n    } catch (e) {}\n  }\n\n  getItems() {\n    return this.state.items ?? this.products;\n  }\n\n  setItems(items) {\n    this.setState({ items }, () => {\n      try { localStorage.setItem(\"tovary-items\", JSON.stringify(items)); } catch (e) {}\n    });\n  }\n\n  saveControls(patch) {\n    this.setState(patch, () => {\n      try {\n        localStorage.setItem(\"tovary-controls\", JSON.stringify({\n          query: this.state.query, maker: this.state.maker, sort: this.state.sort,\n        }));\n      } catch (e) {}\n    });\n  }\n\n  renderVals() {\n    const sel = this.state.selected;\n    const isProducts = this.state.tab === \"products\";\n    const a1 = this.props.accentStart ?? \"#ffd9a8\";\n    const a2 = this.props.accentEnd ?? \"#f5842e\";\n\n    const items = this.getItems();\n    // Поиск: все слова запроса должны найтись в любом текстовом поле\n    const words = this.state.query.trim().toLowerCase().split(/\\s+/).filter(Boolean);\n    let list = items.filter((r) => {\n      if (this.state.maker !== \"all\" && r.maker !== this.state.maker) return false;\n      if (!words.length) return true;\n      const haystack = [r.name, r.art, r.cat, r.desc, r.maker].join(\" \").toLowerCase();\n      return words.every((w) => haystack.includes(w));\n    });\n\n    // Сортировка\n    if (this.state.sort !== \"none\") {\n      const [key, dir] = this.state.sort.split(\"-\");\n      const mul = dir === \"asc\" ? 1 : -1;\n      list = [...list].sort((x, y) => (x[key] - y[key]) * mul);\n    }\n\n    const makers = [...new Set(items.map((r) => r.maker).filter(Boolean))].sort();\n\n    const allOrders = this.state.orderItems ?? this.orders;\n    const oWords = this.state.orderQuery.trim().toLowerCase().split(/\\s+/).filter(Boolean);\n    const orderList = allOrders.filter((o) => {\n      if (!oWords.length) return true;\n      const hay = [o.num, o.arts, o.date, o.delivery, o.address, o.fio, o.code, o.status].join(\" \").toLowerCase();\n      return oWords.every((w) => hay.includes(w));\n    });\n\n    const fdefs = [\n      { key: \"name\",  label: \"Наименование\",  type: \"text\",   span: \"1 / -1\" },\n      { key: \"art\",   label: \"Артикул\",       type: \"text\",   span: \"auto\" },\n      { key: \"cat\",   label: \"Категория\",     type: \"text\",   span: \"auto\" },\n      { key: \"maker\", label: \"Производитель\", type: \"text\",   span: \"auto\" },\n      { key: \"price\", label: \"Цена, ₽\",       type: \"number\", span: \"auto\" },\n      { key: \"disc\",  label: \"Скидка, %\",     type: \"number\", span: \"auto\" },\n      { key: \"stock\", label: \"Остаток, шт.\",  type: \"number\", span: \"auto\" },\n    ];\n\n    return {\n      query: this.state.query,\n      maker: this.state.maker,\n      sort: this.state.sort,\n      onQuery: (e) => this.saveControls({ query: e.target.value }),\n      onMaker: (e) => this.saveControls({ maker: e.target.value }),\n      onSort: (e) => this.saveControls({ sort: e.target.value }),\n      makerOptions: [{ value: \"all\", label: \"Все производители\" }, ...makers.map((m) => ({ value: m, label: m }))],\n      isEmpty: isProducts && list.length === 0,\n      showProducts: isProducts,\n      showOrders: !isProducts,\n      clearVisible: this.state.query.length > 0,\n      clearQuery: () => this.saveControls({ query: \"\" }),\n      orderQuery: this.state.orderQuery,\n      onOrderQuery: (e) => this.setState({ orderQuery: e.target.value }),\n      orderClearVisible: this.state.orderQuery.length > 0,\n      clearOrderQuery: () => this.setState({ orderQuery: \"\" }),\n      orders: orderList.map((o) => ({\n        ...o,\n        statusBg: o.status === \"Новый\" ? \"rgba(245,132,46,0.16)\" : \"rgba(31,138,91,0.13)\",\n        statusColor: o.status === \"Новый\" ? \"#c96a1a\" : \"#1f8a5b\",\n        remove: () => {\n          const left = (this.state.orderItems ?? this.orders).filter((x) => x.num !== o.num);\n          this.setState({ orderItems: left }, () => {\n            try { localStorage.setItem(\"tovary-orders\", JSON.stringify(left)); } catch (e) {}\n          });\n        },\n      })),\n      ordersEmpty: !isProducts && orderList.length === 0,\n      cards: list.map((r) => {\n        const isSel = r.art === sel;\n        const select = () => this.setState({ selected: this.state.selected === r.art ? null : r.art });\n        return {\n          ...r,\n          photoBg: r.photo ? \"url(\" + r.photo + \")\" : \"none\",\n          photoLabel: r.photo ? \"\" : \"Нет фото\",\n          price: r.price.toLocaleString(\"ru-RU\") + \" ₽\",\n          disc: String(r.disc),\n          stock: String(r.stock),\n          select,\n          keySelect: (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); select(); } },\n          edit: (e) => {\n            e.stopPropagation();\n            this.setState({ modal: { mode: \"edit\", art: r.art }, formError: \"\", form: { name: r.name, art: r.art, cat: r.cat, maker: r.maker, price: String(r.price), disc: String(r.disc), stock: String(r.stock), desc: r.desc, photo: r.photo || \"\" } });\n          },\n          remove: (e) => {\n            e.stopPropagation();\n            this.setItems(this.getItems().filter((x) => x.art !== r.art));\n            if (this.state.selected === r.art) this.setState({ selected: null });\n          },\n          border: isSel ? \"2px solid \" + a2 : \"2px solid transparent\",\n          shadow: isSel\n            ? \"8px 8px 20px rgba(174,174,192,0.35), -8px -8px 20px rgba(255,255,255,0.9), 0 0 0 4px \" + a1 + \"55\"\n            : \"8px 8px 20px rgba(174,174,192,0.35), -8px -8px 20px rgba(255,255,255,0.9)\",\n        };\n      }),\n      modalOpen: !!this.state.modal,\n      modalTitle: this.state.modal && this.state.modal.mode === \"edit\" ? \"Редактировать товар\" : \"Новый товар\",\n      openAdd: () => this.setState({ modal: { mode: \"add\" }, formError: \"\", form: { name: \"\", art: \"\", cat: \"\", maker: \"\", price: \"\", disc: \"\", stock: \"\", desc: \"\", photo: \"\" } }),\n      photoPreviewBg: this.state.form.photo ? \"url(\" + this.state.form.photo + \")\" : \"none\",\n      photoPreviewLabel: this.state.form.photo ? \"\" : \"Нет фото\",\n      hasFormPhoto: !!this.state.form.photo,\n      onPhoto: (e) => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const rd = new FileReader();\n        rd.onload = () => this.setState({ form: { ...this.state.form, photo: rd.result } });\n        rd.readAsDataURL(file);\n      },\n      clearPhoto: () => this.setState({ form: { ...this.state.form, photo: \"\" } }),\n      closeModal: () => this.setState({ modal: null }),\n      stopClick: (e) => e.stopPropagation(),\n      formFields: fdefs.map((f) => ({\n        ...f,\n        value: this.state.form[f.key] ?? \"\",\n        onChange: (e) => this.setState({ form: { ...this.state.form, [f.key]: e.target.value } }),\n      })),\n      fDesc: this.state.form.desc ?? \"\",\n      onFDesc: (e) => this.setState({ form: { ...this.state.form, desc: e.target.value } }),\n      hasError: !!this.state.formError,\n      formError: this.state.formError,\n      saveForm: () => {\n        const f = this.state.form;\n        const modal = this.state.modal;\n        if (!f.name || !f.name.trim() || !f.art || !f.art.trim()) {\n          this.setState({ formError: \"Заполните наименование и артикул\" });\n          return;\n        }\n        const art = f.art.trim();\n        const cur = this.getItems();\n        const dupe = cur.some((x) => x.art === art && !(modal.mode === \"edit\" && modal.art === art));\n        if (modal.mode === \"add\" && dupe || modal.mode === \"edit\" && art !== modal.art && cur.some((x) => x.art === art)) {\n          this.setState({ formError: \"Товар с таким артикулом уже существует\" });\n          return;\n        }\n        const rec = {\n          art,\n          name: f.name.trim(),\n          cat: (f.cat || \"\").trim(),\n          maker: (f.maker || \"\").trim(),\n          price: Math.max(0, Number(f.price) || 0),\n          disc: Math.max(0, Number(f.disc) || 0),\n          stock: Math.max(0, Math.round(Number(f.stock) || 0)),\n          desc: (f.desc || \"\").trim(),\n          photo: f.photo || \"\",\n        };\n        const items = modal.mode === \"edit\" ? cur.map((x) => (x.art === modal.art ? rec : x)) : [...cur, rec];\n        this.setItems(items);\n        this.setState({ modal: null, formError: \"\" });\n      },\n      tabProducts: () => this.setState({ tab: \"products\" }),\n      tabOrders: () => this.setState({ tab: \"orders\" }),\n      productsSelected: isProducts,\n      ordersSelected: !isProducts,\n      pillTransform: isProducts ? \"translateX(0)\" : \"translateX(100%)\",\n      tabProductsColor: isProducts ? \"#1c1c1e\" : \"#8a8a8e\",\n      tabProductsWeight: isProducts ? 600 : 400,\n      tabOrdersColor: !isProducts ? \"#1c1c1e\" : \"#8a8a8e\",\n      tabOrdersWeight: !isProducts ? 600 : 400,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
